name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check code quality
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q
  
  
  build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t backend-cicd-lab:ci .

      - name: Start container
        run: |
          docker run -d \
            --name api-smoke \
            -p 127.0.0.1:8000:8000 \
            backend-cicd-lab:ci

      - name: Smoke test
        run: |
          for attempt in {1..20}; do
            if [ "$(docker inspect -f '{{.State.Running}}' api-smoke 2>/dev/null)" != "true" ]; then
              echo "Container exited unexpectedly"
              docker logs api-smoke --tail 100
              exit 1
            fi

            if response=$(curl -fsS --max-time 3 \
              http://127.0.0.1:8000/health 2>/dev/null); then

              if echo "$response" | python -c '
          import json, sys
          assert json.load(sys.stdin) == {"status": "ok"}
          ' 2>/dev/null; then
                echo "Smoke test passed on attempt $attempt"
                exit 0
              fi
            fi

            echo "Attempt $attempt/20: Application not ready"
            sleep 2
          done

          echo "Application never became healthy"
          docker logs api-smoke --tail 100
          exit 1

      - name: Show logs and cleanup
        if: always()
        run: |
          if docker inspect api-smoke >/dev/null 2>&1; then
            docker logs api-smoke
            docker rm -f api-smoke
          fi
