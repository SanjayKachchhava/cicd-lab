name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check code quality
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q
  
  
  build:
    name: Build, smoke test and publish
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Define image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: Start container
        run: |
          docker run -d \
            --name api-smoke \
            -p 127.0.0.1:8000:8000 \
            "$IMAGE:$GITHUB_SHA"

      - name: Verify application startup
        run: |
          for attempt in {1..20}; do
            if [ "$(docker inspect -f '{{.State.Running}}' api-smoke 2>/dev/null)" != "true" ]; then
              echo "Container exited unexpectedly"
              docker logs api-smoke --tail 100
              exit 1
            fi

            if response=$(curl -fsS --max-time 3 \
              http://127.0.0.1:8000/health 2>/dev/null); then

              if echo "$response" | python -c '
          import json, sys
          assert json.load(sys.stdin) == {"status": "ok"}
          ' 2>/dev/null; then
                echo "Smoke test passed on attempt $attempt"
                exit 0
              fi
            fi

            echo "Attempt $attempt/20: Application not ready"
            sleep 2
          done

          echo "Application never became healthy"
          docker logs api-smoke --tail 100
          exit 1

      - name: Show logs and cleanup
        if: always()
        run: |
          if docker inspect api-smoke >/dev/null 2>&1; then
            docker logs api-smoke
            docker rm -f api-smoke
          fi

      
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Publish Docker image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          OUTPUT=$(docker push "$IMAGE:$GITHUB_SHA")
          printf '%s\n' "$OUTPUT"

          DIGEST=$(printf '%s\n' "$OUTPUT" |
            sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' |
            tail -1)

          test -n "$DIGEST"

          echo "image_ref=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"


  deploy-staging:
    name: Deploy to EC2 staging
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: cicd-staging-deployment
      cancel-in-progress: false

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy image via SSM
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}

        run: |
          set -euo pipefail

          : "${INSTANCE_ID:?Missing instance ID}"
          : "${IMAGE_REF:?Missing image digest}"

          PARAMS=$(jq -nc \
            --arg cmd "/usr/local/sbin/deploy-cicd-staging.sh '$IMAGE_REF'" \
            '{commands:[$cmd],executionTimeout:["600"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --comment "Deploy staging image" \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent}' \
              --output json
          else
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json || true

            exit 1
          fi
