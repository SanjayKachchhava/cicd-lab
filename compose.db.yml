services:
  postgres:
    image: postgres:17-alpine
    container_name: cicd-lab-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: cicd_lab_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d cicd_lab_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg_lab_data:/var/lib/postgresql/data
volumes:
  pg_lab_data:
